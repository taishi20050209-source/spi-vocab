<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>SPI単語帳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #f4ede4;
    --paper: #faf6ef;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --accent: #b91c2c;
    --accent-soft: #d4a3a8;
    --gold: #c9a961;
    --line: #d4cab8;
    --learned: #5a7a5a;
    --hard: #b91c2c;
    --part1-color: #2c5f7a;
    --part2-color: #7a4a2c;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
    background: var(--bg);
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
    width: 100%;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(201, 169, 97, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(185, 28, 44, 0.05) 0%, transparent 50%);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 600px;
    margin: 0 auto;
    position: relative;
  }

  /* ============================================
     Part選択画面
  ============================================ */
  .part-select {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 40px 24px;
    overflow-y: auto;
  }

  .part-select.hidden { display: none; }

  .ps-header {
    text-align: center;
    margin-bottom: 36px;
    padding-top: 20px;
  }

  .ps-title {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 32px;
    letter-spacing: 0.2em;
    color: var(--ink);
    margin-bottom: 10px;
    position: relative;
    display: inline-block;
  }

  .ps-title::before, .ps-title::after {
    content: '◆';
    color: var(--accent);
    font-size: 12px;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .ps-title::before { left: -24px; }
  .ps-title::after { right: -24px; }

  .ps-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.3em;
    font-weight: 500;
  }

  .ps-divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 20px auto;
    opacity: 0.6;
  }

  .ps-instruction {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 28px;
    letter-spacing: 0.1em;
    line-height: 1.7;
  }

  .part-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
  }

  .part-card {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 24px 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    text-align: left;
    width: 100%;
    font-family: inherit;
  }

  .part-card::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid var(--line);
    border-radius: 2px;
    pointer-events: none;
  }

  .part-card:active {
    transform: scale(0.98);
  }

  .pc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .pc-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    font-weight: 700;
    color: var(--accent);
  }

  .pc-count {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    font-weight: 500;
  }

  .pc-title {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }

  .pc-desc {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin-bottom: 14px;
  }

  .pc-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
  }

  .pc-progress-bar {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }

  .pc-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    transition: width 0.4s;
  }

  .pc-progress-text {
    color: var(--ink-soft);
    font-weight: 700;
    letter-spacing: 0.05em;
    min-width: 80px;
    text-align: right;
  }

  .pc-progress-text .num { color: var(--ink); }

  .ps-stats {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 20px;
    margin-top: auto;
  }

  .ps-stats-title {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.3em;
    font-weight: 700;
    margin-bottom: 10px;
    text-align: center;
  }

  .ps-stats-row {
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .ps-stat-item .num {
    font-size: 22px;
    font-weight: 900;
    display: block;
    margin-bottom: 2px;
  }

  .ps-stat-item .num.learned { color: var(--learned); }
  .ps-stat-item .num.hard { color: var(--hard); }

  .ps-stat-item .label {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  /* ============================================
     学習画面
  ============================================ */
  .study-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .study-screen.hidden { display: none; }

  /* ヘッダー */
  header {
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: relative;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--line);
    width: 32px;
    height: 32px;
    border-radius: 4px;
    color: var(--ink);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
  }

  .back-btn:active {
    background: var(--ink);
    color: var(--paper);
  }

  .title {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 0.15em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .title-mark {
    color: var(--accent);
    font-size: 9px;
  }

  .mode-switcher {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 3px;
    border-radius: 20px;
    border: 1px solid var(--line);
  }

  .mode-btn {
    background: none;
    border: none;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .mode-btn.active {
    background: var(--ink);
    color: var(--paper);
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    margin-top: 10px;
  }

  .progress-info {
    display: flex;
    gap: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-top: 8px;
  }

  .progress-info .label {
    opacity: 0.7;
  }

  .progress-info .num {
    font-weight: 700;
    color: var(--ink);
  }

  .progress-info .num.learned { color: var(--learned); }
  .progress-info .num.hard { color: var(--hard); }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    width: 0%;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* メインカード */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .card-stack {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--paper);
    border-radius: 4px;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.03),
      0 4px 12px rgba(0,0,0,0.08),
      0 20px 40px rgba(0,0,0,0.06);
    cursor: pointer;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid var(--line);
    border-radius: 2px;
    pointer-events: none;
  }

  .card.exit-left {
    transform: translateX(-120%) rotate(-8deg);
    opacity: 0;
  }

  .card.exit-right {
    transform: translateX(120%) rotate(8deg);
    opacity: 0;
  }

  .card.enter {
    animation: cardEnter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes cardEnter {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .card-corner {
    position: absolute;
    top: 18px;
    left: 18px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    font-weight: 500;
    z-index: 2;
  }

  .card-corner-right {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-weight: 700;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }

  .status-dot.learned { background: var(--learned); }
  .status-dot.hard { background: var(--hard); }

  .card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
    text-align: center;
    position: relative;
  }

  .word {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: clamp(34px, 8.5vw, 52px);
    color: var(--ink);
    letter-spacing: 0.05em;
    line-height: 1.3;
    margin-bottom: 14px;
    word-break: keep-all;
  }

  .reading {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .reading.show {
    opacity: 1;
  }

  .tap-hint {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
    opacity: 0.5;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  /* 意味表示 */
  .meaning-section {
    background: linear-gradient(180deg, transparent, rgba(212, 202, 184, 0.15));
    border-top: 1px solid var(--line);
    padding: 0 28px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s;
  }

  .meaning-section.show {
    max-height: 280px;
    padding: 24px 28px 28px;
  }

  .meaning-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meaning-label::before,
  .meaning-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--accent-soft);
    opacity: 0.5;
  }

  .meaning {
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* ボタン */
  .controls {
    padding: 14px 20px 22px;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }

  .button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .btn {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.1em;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-hard {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-hard:active {
    background: var(--accent);
    color: var(--paper);
  }

  .btn-learned {
    border-color: var(--learned);
    color: var(--learned);
  }

  .btn-learned:active {
    background: var(--learned);
    color: var(--paper);
  }

  .btn-icon {
    font-size: 16px;
    line-height: 1;
  }

  .btn-next {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    padding: 16px;
    font-size: 15px;
  }

  .btn-next:active {
    background: var(--ink-soft);
  }

  .btn-next:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .btn-next .arrow {
    margin-left: 8px;
  }

  /* 完了画面 */
  .complete-screen {
    position: absolute;
    inset: 0;
    background: var(--paper);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    z-index: 100;
  }

  .complete-screen.show {
    display: flex;
    animation: fadeIn 0.4s;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .complete-mark {
    font-size: 64px;
    color: var(--gold);
    margin-bottom: 16px;
    font-weight: 900;
  }

  .complete-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  .complete-subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 32px;
    letter-spacing: 0.05em;
    line-height: 1.7;
  }

  .complete-stats {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    padding: 20px 32px;
    background: var(--bg);
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .stat-num.learned { color: var(--learned); }
  .stat-num.hard { color: var(--hard); }

  .stat-label {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  .complete-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 280px;
  }

  /* メニュー */
  .menu-btn {
    background: none;
    border: 1px solid var(--line);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
  }

  .menu-btn:active {
    background: var(--ink);
    color: var(--paper);
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }

  .menu-overlay.show {
    display: flex;
    animation: fadeIn 0.2s;
  }

  .menu-sheet {
    background: var(--paper);
    width: 100%;
    max-width: 600px;
    border-radius: 12px 12px 0 0;
    padding: 24px 20px 32px;
    animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .menu-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .menu-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: 0.1em;
  }

  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    cursor: pointer;
  }

  .menu-item:last-of-type {
    border-bottom: none;
  }

  .menu-item-danger {
    color: var(--accent);
    font-weight: 700;
  }

  .menu-close {
    width: 100%;
    background: var(--bg);
    border: none;
    padding: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    border-radius: 4px;
    margin-top: 16px;
    cursor: pointer;
    letter-spacing: 0.1em;
  }

  /* 装飾 */
  .deco-corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 1.5px solid var(--gold);
    pointer-events: none;
    opacity: 0.4;
  }

  .deco-tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .deco-tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .deco-bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .deco-br { bottom: 14px; right: 14px; border-left: none; border-top: none; }
</style>
</head>
<body>
<div class="app">

  <!-- ============================================
       Part選択画面
  ============================================ -->
  <div class="part-select" id="partSelect">
    <div class="ps-header">
      <h1 class="ps-title">SPI 語句帳</h1>
      <div class="ps-divider"></div>
      <p class="ps-subtitle">VOCABULARY MASTERY</p>
    </div>

    <p class="ps-instruction">学習する単元を選んでください</p>

    <div class="part-cards">
      <button class="part-card" data-part="1">
        <div class="pc-header">
          <span class="pc-label">PART  I</span>
          <span class="pc-count" id="part1Count">120 語</span>
        </div>
        <div class="pc-title">頻出語句 [基礎編]</div>
        <div class="pc-desc">SPI試験で頻繁に登場する熟語・慣用句を網羅</div>
        <div class="pc-progress">
          <div class="pc-progress-bar">
            <div class="pc-progress-fill" id="part1Fill" style="width: 0%"></div>
          </div>
          <span class="pc-progress-text">覚えた <span class="num" id="part1Learned">0</span>/<span id="part1Total">120</span></span>
        </div>
      </button>

      <button class="part-card" data-part="2">
        <div class="pc-header">
          <span class="pc-label">PART II</span>
          <span class="pc-count" id="part2Count">92 語</span>
        </div>
        <div class="pc-title">頻出語句 [応用編]</div>
        <div class="pc-desc">対義語・類義語を含む応用的な語句</div>
        <div class="pc-progress">
          <div class="pc-progress-bar">
            <div class="pc-progress-fill" id="part2Fill" style="width: 0%"></div>
          </div>
          <span class="pc-progress-text">覚えた <span class="num" id="part2Learned">0</span>/<span id="part2Total">92</span></span>
        </div>
      </button>
    </div>

    <div class="ps-stats">
      <div class="ps-stats-title">— 全体の学習状況 —</div>
      <div class="ps-stats-row">
        <div class="ps-stat-item">
          <span class="num" id="totalAll">212</span>
          <span class="label">総語句</span>
        </div>
        <div class="ps-stat-item">
          <span class="num learned" id="totalLearned">0</span>
          <span class="label">覚えた</span>

const PARTS = {
  1: { name: 'PART I',  subtitle: '頻出語句 [基礎編]', words: PART1_WORDS },
  2: { name: 'PART II', subtitle: '頻出語句 [応用編]', words: PART2_WORDS }
};

const STORAGE_KEY = 'spi_vocab_state_v2';

// ========================================
// 状態
// ========================================
let state = {
  // status: { 1: { 0: 'learned'|'hard', ... }, 2: { ... } }
  status: { 1: {}, 2: {} },
  currentPart: null,
  mode: 'all',
  currentIdx: 0,
  order: []
};

let isFlipped = false;

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state.status = { 1: {}, 2: {}, ...parsed.status };
      if (!state.status[1]) state.status[1] = {};
      if (!state.status[2]) state.status[2] = {};
    }
  } catch (e) { console.error(e); }

  // 旧バージョンのデータを引き継ぐ (v1 → v2 migration)
  try {
    const oldSaved = localStorage.getItem('spi_vocab_state_v1');
    if (oldSaved && Object.keys(state.status[1]).length === 0) {
      const oldParsed = JSON.parse(oldSaved);
      if (oldParsed.status) {
        state.status[1] = oldParsed.status;
        saveState();
      }
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ status: state.status }));
  } catch (e) { console.error(e); }
}

// ========================================
// Part選択画面
// ========================================
function showPartSelect() {
  document.getElementById('partSelect').classList.remove('hidden');
  document.getElementById('studyScreen').classList.add('hidden');
  updatePartSelectUI();
}

function updatePartSelectUI() {
  [1, 2].forEach(p => {
    const total = PARTS[p].words.length;
    const learned = Object.values(state.status[p] || {}).filter(s => s === 'learned').length;
    const pct = total > 0 ? (learned / total) * 100 : 0;
    document.getElementById(`part${p}Total`).textContent = total;
    document.getElementById(`part${p}Count`).textContent = total + ' 語';
    document.getElementById(`part${p}Learned`).textContent = learned;
    document.getElementById(`part${p}Fill`).style.width = pct + '%';
  });

  const totalAll = PARTS[1].words.length + PARTS[2].words.length;
  const totalLearned =
    Object.values(state.status[1] || {}).filter(s => s === 'learned').length +
    Object.values(state.status[2] || {}).filter(s => s === 'learned').length;
  const totalHard =
    Object.values(state.status[1] || {}).filter(s => s === 'hard').length +
    Object.values(state.status[2] || {}).filter(s => s === 'hard').length;
  document.getElementById('totalAll').textContent = totalAll;
  document.getElementById('totalLearned').textContent = totalLearned;
  document.getElementById('totalHard').textContent = totalHard;
}

// ========================================
// 学習画面
// ========================================
function startStudy(partNum) {
  state.currentPart = partNum;
  state.mode = 'all';
  state.currentIdx = 0;

  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-mode="all"]').classList.add('active');

  document.getElementById('studyTitle').textContent = PARTS[partNum].name;
  document.getElementById('partSelect').classList.add('hidden');
  document.getElementById('studyScreen').classList.remove('hidden');

  document.getElementById('hardBtn').disabled = false;
  document.getElementById('learnedBtn').disabled = false;

  buildOrder();
  renderCard();
}

function buildOrder() {
  const partNum = state.currentPart;
  const words = PARTS[partNum].words;
  const status = state.status[partNum] || {};
  let indices = words.map((_, i) => i);
  if (state.mode === 'hard') {
    indices = indices.filter(i => status[i] === 'hard');
  } else if (state.mode === 'unlearned') {
    indices = indices.filter(i => status[i] !== 'learned');
  }
  state.order = indices;
  state.currentIdx = 0;
}

function shuffleOrder() {
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.currentIdx = 0;
}

function getCurrentWord() {
  if (state.currentIdx >= state.order.length) return null;
  const idx = state.order[state.currentIdx];
  return { ...PARTS[state.currentPart].words[idx], idx };
}

const stack = document.getElementById('cardStack');
const completeScreen = document.getElementById('completeScreen');

function renderCard() {
  const data = getCurrentWord();
  if (!data) { showComplete(); return; }

  completeScreen.classList.remove('show');
  isFlipped = false;

  const status = state.status[state.currentPart][data.idx];
  let badge = '';
  if (status === 'learned') {
    badge = '<div class="card-corner-right"><span class="status-dot learned"></span>覚えた</div>';
  } else if (status === 'hard') {
    badge = '<div class="card-corner-right"><span class="status-dot hard"></span>苦手</div>';
  }

  stack.innerHTML = `
    <div class="card enter" id="currentCard">
      <span class="deco-corner deco-tl"></span>
      <span class="deco-corner deco-tr"></span>
      <span class="deco-corner deco-bl"></span>
      <span class="deco-corner deco-br"></span>
      <div class="card-corner">第 ${state.currentIdx + 1} 語</div>
      ${badge}
      <div class="card-content">
        <div class="word">${data.word}</div>
        <div class="reading" id="reading">${data.reading}</div>
        <div class="tap-hint" id="tapHint">タップして意味を表示</div>
      </div>
      <div class="meaning-section" id="meaningSection">
        <div class="meaning-label">意 味</div>
        <div class="meaning">${data.meaning}</div>
      </div>
    </div>
  `;
  document.getElementById('currentCard').addEventListener('click', flipCard);
  updateProgress();
  updateNextButton();
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  document.getElementById('reading').classList.add('show');
  document.getElementById('meaningSection').classList.add('show');
  const hint = document.getElementById('tapHint');
  if (hint) hint.style.display = 'none';
  updateNextButton();
}

function updateNextButton() {
  document.getElementById('nextBtn').disabled = !isFlipped;
}

function nextCard(direction = 'right') {
  if (!isFlipped) return;
  const card = document.getElementById('currentCard');
  if (card) card.classList.add(direction === 'left' ? 'exit-left' : 'exit-right');
  setTimeout(() => {
    state.currentIdx++;
    renderCard();
  }, 300);
}

function markCurrent(status) {
  const data = getCurrentWord();
  if (!data) return;
  state.status[state.currentPart][data.idx] = status;
  saveState();

  const oldBadge = document.querySelector('.card-corner-right');
  if (oldBadge) oldBadge.remove();
  const card = document.getElementById('currentCard');
  if (card) {
    const newBadge = document.createElement('div');
    newBadge.className = 'card-corner-right';
    newBadge.innerHTML = status === 'learned'
      ? '<span class="status-dot learned"></span>覚えた'
      : '<span class="status-dot hard"></span>苦手';
    card.appendChild(newBadge);
  }
  updateProgress();
  if (!isFlipped) flipCard();
  setTimeout(() => nextCard(status === 'hard' ? 'left' : 'right'), 250);
}

function updateProgress() {
  const total = state.order.length;
  const current = Math.min(state.currentIdx + 1, total);
  const status = state.status[state.currentPart] || {};
  const learned = Object.values(status).filter(s => s === 'learned').length;
  const hard = Object.values(status).filter(s => s === 'hard').length;
  document.getElementById('currentNum').textContent = total > 0 ? current : 0;
  document.getElementById('totalNum').textContent = total;
  document.getElementById('learnedNum').textContent = learned;
  document.getElementById('hardNum').textContent = hard;
  document.getElementById('progressFill').style.width = (total > 0 ? (state.currentIdx / total) * 100 : 0) + '%';
}

function showComplete() {
  stack.innerHTML = '';
  const status = state.status[state.currentPart] || {};
  const learned = Object.values(status).filter(s => s === 'learned').length;
  const hard = Object.values(status).filter(s => s === 'hard').length;
  document.getElementById('finalLearned').textContent = learned;
  document.getElementById('finalHard').textContent = hard;
  const reviewBtn = document.getElementById('reviewHardBtn');
  reviewBtn.disabled = hard === 0;
  reviewBtn.style.opacity = hard === 0 ? '0.4' : '1';
  if (state.order.length === 0) {
    completeScreen.querySelector('.complete-title').textContent = '対象なし';
    completeScreen.querySelector('.complete-subtitle').innerHTML = 'このモードに該当する語句がありません';
  } else {
    completeScreen.querySelector('.complete-title').textContent = '完了';
    completeScreen.querySelector('.complete-subtitle').innerHTML = 'お疲れさまでした<br>本日の学習を達成しました';
  }
  completeScreen.classList.add('show');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('currentNum').textContent = state.order.length;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('hardBtn').disabled = true;
  document.getElementById('learnedBtn').disabled = true;
}

// ========================================
// イベント
// ========================================
document.querySelectorAll('.part-card').forEach(card => {
  card.addEventListener('click', () => {
    const partNum = parseInt(card.dataset.part);
    startStudy(partNum);
  });
});

document.getElementById('backBtn').addEventListener('click', showPartSelect);
document.getElementById('backToSelectBtn').addEventListener('click', showPartSelect);

document.getElementById('nextBtn').addEventListener('click', () => nextCard('right'));
document.getElementById('hardBtn').addEventListener('click', () => markCurrent('hard'));
document.getElementById('learnedBtn').addEventListener('click', () => markCurrent('learned'));

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    document.getElementById('hardBtn').disabled = false;
    document.getElementById('learnedBtn').disabled = false;
    buildOrder();
    renderCard();
  });
});

// メニュー
const menuOverlay = document.getElementById('menuOverlay');
document.getElementById('menuBtn').addEventListener('click', () => menuOverlay.classList.add('show'));
document.getElementById('menuCloseBtn').addEventListener('click', () => menuOverlay.classList.remove('show'));
menuOverlay.addEventListener('click', (e) => { if (e.target === menuOverlay) menuOverlay.classList.remove('show'); });

document.getElementById('shuffleItem').addEventListener('click', () => {
  buildOrder(); shuffleOrder();
  document.getElementById('hardBtn').disabled = false;
  document.getElementById('learnedBtn').disabled = false;
  renderCard();
  menuOverlay.classList.remove('show');
});

document.getElementById('resetProgressItem').addEventListener('click', () => {
  if (confirm('この単元の学習位置をリセットしますか?
(覚えた/苦手の記録は残ります)')) {
    state.currentIdx = 0;
    document.getElementById('hardBtn').disabled = false;
    document.getElementById('learnedBtn').disabled = false;
    buildOrder(); renderCard();
  }
  menuOverlay.classList.remove('show');
});

document.getElementById('resetPartItem').addEventListener('click', () => {
  if (confirm('この単元の覚えた/苦手の記録をすべてリセットしますか?')) {
    state.status[state.currentPart] = {};
    state.currentIdx = 0;
    saveState();
    document.getElementById('hardBtn').disabled = false;
    document.getElementById('learnedBtn').disabled = false;
    buildOrder(); renderCard();
  }
  menuOverlay.classList.remove('show');
});

document.getElementById('resetAllItem').addEventListener('click', () => {
  if (confirm('全単元の記録をすべてリセットしますか?
この操作は取り消せません。')) {
    state.status = { 1: {}, 2: {} };
    state.currentIdx = 0;
    saveState();
    showPartSelect();
  }
  menuOverlay.classList.remove('show');
});

document.getElementById('restartBtn').addEventListener('click', () => {
  state.currentIdx = 0;
  document.getElementById('hardBtn').disabled = false;
  document.getElementById('learnedBtn').disabled = false;
  buildOrder(); renderCard();
});

document.getElementById('reviewHardBtn').addEventListener('click', () => {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-mode="hard"]').classList.add('active');
  state.mode = 'hard';
  document.getElementById('hardBtn').disabled = false;
  document.getElementById('learnedBtn').disabled = false;
  buildOrder(); renderCard();
});

document.addEventListener('keydown', (e) => {
  if (document.getElementById('studyScreen').classList.contains('hidden')) return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!isFlipped) flipCard(); else nextCard('right');
  } else if (e.key === '1' || e.key === 'ArrowLeft') {
    if (isFlipped) markCurrent('hard');
  } else if (e.key === '2' || e.key === 'ArrowRight') {
    if (isFlipped) markCurrent('learned');
  } else if (e.key === 'Escape') {
    showPartSelect();
  }
});

// ========================================
// 初期化
// ========================================
loadState();
showPartSelect();
</script>
