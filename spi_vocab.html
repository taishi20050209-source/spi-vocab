<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>SPI単語帳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #f4ede4;
    --paper: #faf6ef;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --accent: #b91c2c;
    --accent-soft: #d4a3a8;
    --gold: #c9a961;
    --line: #d4cab8;
    --learned: #5a7a5a;
    --hard: #b91c2c;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
    background: var(--bg);
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
    width: 100%;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(201, 169, 97, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(185, 28, 44, 0.05) 0%, transparent 50%);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 600px;
    margin: 0 auto;
    position: relative;
  }

  /* === ヘッダー === */
  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: 24px;
    right: 24px;
    height: 1px;
    background: var(--line);
    opacity: 0.5;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .title {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 0.15em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .title::before {
    content: '◆';
    color: var(--accent);
    font-size: 10px;
  }

  .mode-switcher {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 3px;
    border-radius: 20px;
    border: 1px solid var(--line);
  }

  .mode-btn {
    background: none;
    border: none;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .mode-btn.active {
    background: var(--ink);
    color: var(--paper);
  }

  /* === 進捗 === */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
  }

  .progress-info {
    display: flex;
    gap: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  .progress-info .label {
    opacity: 0.7;
  }

  .progress-info .num {
    font-weight: 700;
    color: var(--ink);
  }

  .progress-info .num.learned { color: var(--learned); }
  .progress-info .num.hard { color: var(--hard); }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    width: 0%;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* === メインカード === */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .card-stack {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--paper);
    border-radius: 4px;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.03),
      0 4px 12px rgba(0,0,0,0.08),
      0 20px 40px rgba(0,0,0,0.06);
    cursor: pointer;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid var(--line);
    border-radius: 2px;
    pointer-events: none;
  }

  .card.exit-left {
    transform: translateX(-120%) rotate(-8deg);
    opacity: 0;
  }

  .card.exit-right {
    transform: translateX(120%) rotate(8deg);
    opacity: 0;
  }

  .card.enter {
    animation: cardEnter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes cardEnter {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .card-corner {
    position: absolute;
    top: 18px;
    left: 18px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    font-weight: 500;
    z-index: 2;
  }

  .card-corner-right {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-weight: 700;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }

  .status-dot.learned { background: var(--learned); }
  .status-dot.hard { background: var(--hard); }

  .card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
    text-align: center;
    position: relative;
  }

  .word {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: clamp(38px, 9vw, 56px);
    color: var(--ink);
    letter-spacing: 0.05em;
    line-height: 1.3;
    margin-bottom: 14px;
    word-break: keep-all;
  }

  .reading {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .reading.show {
    opacity: 1;
  }

  .tap-hint {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
    opacity: 0.5;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  /* === 意味表示 === */
  .meaning-section {
    background: linear-gradient(180deg, transparent, rgba(212, 202, 184, 0.15));
    border-top: 1px solid var(--line);
    padding: 28px 28px 32px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s;
    padding-top: 0;
    padding-bottom: 0;
  }

  .meaning-section.show {
    max-height: 280px;
    padding-top: 24px;
    padding-bottom: 28px;
  }

  .meaning-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meaning-label::before,
  .meaning-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--accent-soft);
    opacity: 0.5;
  }

  .meaning {
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* === ボタン === */
  .controls {
    padding: 16px 20px 24px;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }

  .button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .btn {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 16px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.1em;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    -webkit-touch-callout: none;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-hard {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-hard:active {
    background: var(--accent);
    color: var(--paper);
  }

  .btn-learned {
    border-color: var(--learned);
    color: var(--learned);
  }

  .btn-learned:active {
    background: var(--learned);
    color: var(--paper);
  }

  .btn-icon {
    font-size: 16px;
    line-height: 1;
  }

  .btn-next {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    padding: 18px;
    font-size: 15px;
  }

  .btn-next:active {
    background: var(--ink-soft);
  }

  .btn-next:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .btn-next .arrow {
    margin-left: 8px;
    transition: transform 0.2s;
  }

  .btn-next:not(:disabled):hover .arrow {
    transform: translateX(4px);
  }

  /* === 完了画面 === */
  .complete-screen {
    position: absolute;
    inset: 0;
    background: var(--paper);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    z-index: 100;
  }

  .complete-screen.show {
    display: flex;
    animation: fadeIn 0.4s;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .complete-mark {
    font-size: 64px;
    color: var(--gold);
    margin-bottom: 16px;
    font-weight: 900;
  }

  .complete-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  .complete-subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 32px;
    letter-spacing: 0.05em;
    line-height: 1.7;
  }

  .complete-stats {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    padding: 20px 32px;
    background: var(--bg);
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .stat-num.learned { color: var(--learned); }
  .stat-num.hard { color: var(--hard); }

  .stat-label {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  .complete-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 280px;
  }

  /* === メニュー (リセット) === */
  .menu-btn {
    background: none;
    border: 1px solid var(--line);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .menu-btn:active {
    background: var(--ink);
    color: var(--paper);
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }

  .menu-overlay.show {
    display: flex;
    animation: fadeIn 0.2s;
  }

  .menu-sheet {
    background: var(--paper);
    width: 100%;
    max-width: 600px;
    border-radius: 12px 12px 0 0;
    padding: 24px 20px 32px;
    animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .menu-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .menu-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: 0.1em;
  }

  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    cursor: pointer;
  }

  .menu-item:last-of-type {
    border-bottom: none;
  }

  .menu-item-danger {
    color: var(--accent);
    font-weight: 700;
  }

  .menu-close {
    width: 100%;
    background: var(--bg);
    border: none;
    padding: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    border-radius: 4px;
    margin-top: 16px;
    cursor: pointer;
    letter-spacing: 0.1em;
  }

  /* === 装飾 === */
  .deco-corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 1.5px solid var(--gold);
    pointer-events: none;
    opacity: 0.4;
  }

  .deco-tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .deco-tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .deco-bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .deco-br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  /* === 空状態 === */
  .empty-state {
    text-align: center;
    padding: 40px;
  }

  .empty-state h3 {
    font-size: 20px;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  .empty-state p {
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top">
      <h1 class="title">SPI 語句帳</h1>
      <button class="menu-btn" id="menuBtn" aria-label="メニュー">⋯</button>
    </div>

    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="all">全て</button>
      <button class="mode-btn" data-mode="hard">苦手</button>
      <button class="mode-btn" data-mode="unlearned">未習</button>
    </div>

    <div class="progress-wrap" style="margin-top: 12px;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="progress-info" style="margin-top: 8px;">
      <span><span class="label">進捗</span> <span class="num" id="currentNum">0</span> / <span id="totalNum">0</span></span>
      <span><span class="label">覚えた</span> <span class="num learned" id="learnedNum">0</span></span>
      <span><span class="label">苦手</span> <span class="num hard" id="hardNum">0</span></span>
    </div>
  </header>

  <main>
    <div class="card-stack" id="cardStack">
      <!-- カードはJSで挿入 -->
    </div>

    <div class="complete-screen" id="completeScreen">
      <div class="complete-mark">◆</div>
      <h2 class="complete-title">完了</h2>
      <p class="complete-subtitle">お疲れさまでした<br>本日の学習を達成しました</p>
      <div class="complete-stats">
        <div class="stat">
          <div class="stat-num learned" id="finalLearned">0</div>
          <div class="stat-label">覚えた</div>
        </div>
        <div class="stat">
          <div class="stat-num hard" id="finalHard">0</div>
          <div class="stat-label">苦手</div>
        </div>
      </div>
      <div class="complete-actions">
        <button class="btn btn-next" id="restartBtn">もう一度</button>
        <button class="btn" id="reviewHardBtn">苦手な語句を復習</button>
      </div>
    </div>
  </main>

  <div class="controls">
    <div class="button-row">
      <button class="btn btn-hard" id="hardBtn">
        <span class="btn-icon">×</span>もう一度
      </button>
      <button class="btn btn-learned" id="learnedBtn">
        <span class="btn-icon">○</span>覚えた
      </button>
    </div>
    <button class="btn btn-next" id="nextBtn">
      次へ <span class="arrow">→</span>
    </button>
  </div>
</div>

<!-- メニュー -->
<div class="menu-overlay" id="menuOverlay">
  <div class="menu-sheet">
    <div class="menu-handle"></div>
    <h3 class="menu-title">メニュー</h3>
    <div class="menu-item" id="shuffleItem">
      <span>順番をシャッフル</span>
      <span>↻</span>
    </div>
    <div class="menu-item" id="resetProgressItem">
      <span>進捗をリセット</span>
      <span>○</span>
    </div>
    <div class="menu-item menu-item-danger" id="resetAllItem">
      <span>全データをリセット</span>
      <span>×</span>
    </div>
    <button class="menu-close" id="menuCloseBtn">閉じる</button>
  </div>
</div>

<script>
// ========================================
// データ: SPI頻出語句
// ========================================
const WORDS = [
  { word: "論う", reading: "あげつらう", meaning: "過去の失敗などを、いちいち取り上げて非難すること。" },
  { word: "斡旋", reading: "あっせん", meaning: "間に入って双方をうまく取り持つこと。" },
  { word: "軋轢", reading: "あつれき", meaning: "葛藤が生じること。仲が悪くなること。" },
  { word: "亜流", reading: "ありゅう", meaning: "本流から派生したもので、本物には及ばないが、本物に追従するような形で存在していること。" },
  { word: "委細", reading: "いさい", meaning: "細かく詳しいこと。詳しい事情。" },
  { word: "いみじくも", reading: "いみじくも", meaning: "非常にうまく。適切に。" },
  { word: "うつつ", reading: "うつつ", meaning: "この世に現に存在しているもの。また、夢とも現実ともはっきりしない状態。" },
  { word: "営々", reading: "えいえい", meaning: "休むことなく、一生懸命働くさま。" },
  { word: "英断", reading: "えいだん", meaning: "きっぱりと物事を決めること。また、優れた決断のこと。" },
  { word: "英知", reading: "えいち", meaning: "優れた知恵。深く物事の道理に通じる才知。" },
  { word: "会得", reading: "えとく", meaning: "物事の意味、本質などを理解し悟ること。" },
  { word: "沿革", reading: "えんかく", meaning: "物事の移り変わり。" },
  { word: "婉曲", reading: "えんきょく", meaning: "言い回しが穏やかで、角が立たないさま。" },
  { word: "横柄", reading: "おうへい", meaning: "他に対して偉そうな態度をとるさま。" },
  { word: "押し並べて", reading: "おしなべて", meaning: "全体にわたって。" },
  { word: "邂逅", reading: "かいこう", meaning: "思いがけなく出会うこと。偶然の出会い。" },
  { word: "回視", reading: "かいし", meaning: "過去を振り返ってみること。" },
  { word: "懐柔", reading: "かいじゅう", meaning: "うまく手なずけ、自分の思い通りにことを運ぶこと。" },
  { word: "瓦解", reading: "がかい", meaning: "秩序のあるものや組織が壊れてその機能を失うこと。" },
  { word: "佳境", reading: "かきょう", meaning: "興味を感じさせる場面のこと。" },
  { word: "角逐", reading: "かくちく", meaning: "互いに競い合うこと。競り合うこと。" },
  { word: "呵責", reading: "かしゃく", meaning: "厳しくとがめて叱ること。責め苦しめること。" },
  { word: "闊達", reading: "かったつ", meaning: "心が大きく、小さな物事にこだわらないこと。" },
  { word: "寡聞", reading: "かぶん", meaning: "物事を見聞きすることが少なく、見識に乏しいさま。" },
  { word: "甘受", reading: "かんじゅ", meaning: "やむを得ないものとしてあまんじて受け入れること。" },
  { word: "奸知", reading: "かんち", meaning: "悪賢い知恵。悪知恵。" },
  { word: "看破", reading: "かんぱ", meaning: "見破ること。物事の真相や裏面を見抜くこと。" },

  { word: "躍如", reading: "やくじょ", meaning: "いきいきとしていて、目の前に見えるさま。" },
  { word: "雄飛", reading: "ゆうひ", meaning: "大きな志を抱いて盛んに活動すること。" },
  { word: "流布", reading: "るふ", meaning: "世に広まること。広く世間に行き渡ること。" },
  { word: "励行", reading: "れいこう", meaning: "決めたこと、決められたことをその通りに実行すること。" },
  { word: "憐憫", reading: "れんびん", meaning: "かわいそうに思うこと。憐れむこと。" },

// ========================================
// 状態管理
// ========================================
const STORAGE_KEY = 'spi_vocab_state_v1';

let state = {
  status: {}, // { 0: 'learned' | 'hard' | null, ... }
  mode: 'all', // 'all' | 'hard' | 'unlearned'
  currentIdx: 0,
  order: [], // 表示順のインデックス配列
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state.status = parsed.status || {};
    }
  } catch (e) {
    console.error('Load failed:', e);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ status: state.status }));
  } catch (e) {
    console.error('Save failed:', e);
  }
}

// ========================================
// 表示順を生成
// ========================================
function buildOrder() {
  let indices = WORDS.map((_, i) => i);

  if (state.mode === 'hard') {
    indices = indices.filter(i => state.status[i] === 'hard');
  } else if (state.mode === 'unlearned') {
    indices = indices.filter(i => state.status[i] !== 'learned');
  }

  state.order = indices;
  state.currentIdx = 0;
}

function shuffleOrder() {
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.currentIdx = 0;
}

// ========================================
// レンダリング
// ========================================
const stack = document.getElementById('cardStack');
const completeScreen = document.getElementById('completeScreen');

let isFlipped = false;

function getCurrentWord() {
  if (state.currentIdx >= state.order.length) return null;
  const wordIdx = state.order[state.currentIdx];
  return { ...WORDS[wordIdx], idx: wordIdx };
}

function renderCard() {
  const data = getCurrentWord();

  if (!data) {
    showComplete();
    return;
  }

  completeScreen.classList.remove('show');
  isFlipped = false;

  const status = state.status[data.idx];
  let statusBadge = '';
  if (status === 'learned') {
    statusBadge = '<div class="card-corner-right"><span class="status-dot learned"></span>覚えた</div>';
  } else if (status === 'hard') {
    statusBadge = '<div class="card-corner-right"><span class="status-dot hard"></span>苦手</div>';
  }

  stack.innerHTML = `
    <div class="card enter" id="currentCard">
      <span class="deco-corner deco-tl"></span>
      <span class="deco-corner deco-tr"></span>
      <span class="deco-corner deco-bl"></span>
      <span class="deco-corner deco-br"></span>
      <div class="card-corner">第 ${state.currentIdx + 1} 語</div>
      ${statusBadge}
      <div class="card-content">
        <div class="word">${data.word}</div>
        <div class="reading" id="reading">${data.reading}</div>
        <div class="tap-hint" id="tapHint">タップして意味を表示</div>
      </div>
      <div class="meaning-section" id="meaningSection">
        <div class="meaning-label">意 味</div>
        <div class="meaning">${data.meaning}</div>
      </div>
    </div>
  `;

  const card = document.getElementById('currentCard');
  card.addEventListener('click', flipCard);

  updateProgress();
  updateNextButton();
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;

  document.getElementById('reading').classList.add('show');
  document.getElementById('meaningSection').classList.add('show');
  const hint = document.getElementById('tapHint');
  if (hint) hint.style.display = 'none';

  updateNextButton();
}

function updateNextButton() {
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = !isFlipped;
}

function nextCard(direction = 'right') {
  if (!isFlipped) return;

  const card = document.getElementById('currentCard');
  if (card) {
    card.classList.add(direction === 'left' ? 'exit-left' : 'exit-right');
  }

  setTimeout(() => {
    state.currentIdx++;
    renderCard();
  }, 300);
}

function markCurrent(status) {
  const data = getCurrentWord();
  if (!data) return;

  state.status[data.idx] = status;
  saveState();

  // バッジを即時更新
  const oldBadge = document.querySelector('.card-corner-right');
  if (oldBadge) oldBadge.remove();

  const card = document.getElementById('currentCard');
  if (card) {
    const newBadge = document.createElement('div');
    newBadge.className = 'card-corner-right';
    newBadge.innerHTML = status === 'learned'
      ? '<span class="status-dot learned"></span>覚えた'
      : '<span class="status-dot hard"></span>苦手';
    card.appendChild(newBadge);
  }

  updateProgress();

  // 自動で次へ (少し遅延)
  if (!isFlipped) {
    flipCard();
  }
  setTimeout(() => {
    nextCard(status === 'hard' ? 'left' : 'right');
  }, 250);
}

function updateProgress() {
  const total = state.order.length;
  const current = Math.min(state.currentIdx + 1, total);
  const learned = Object.values(state.status).filter(s => s === 'learned').length;
  const hard = Object.values(state.status).filter(s => s === 'hard').length;

  document.getElementById('currentNum').textContent = total > 0 ? current : 0;
  document.getElementById('totalNum').textContent = total;
  document.getElementById('learnedNum').textContent = learned;
  document.getElementById('hardNum').textContent = hard;

  const pct = total > 0 ? (state.currentIdx / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showComplete() {
  stack.innerHTML = '';

  const learned = Object.values(state.status).filter(s => s === 'learned').length;
  const hard = Object.values(state.status).filter(s => s === 'hard').length;

  document.getElementById('finalLearned').textContent = learned;
  document.getElementById('finalHard').textContent = hard;

  // 苦手復習ボタンの有効化
  const reviewBtn = document.getElementById('reviewHardBtn');
  reviewBtn.disabled = hard === 0;
  reviewBtn.style.opacity = hard === 0 ? '0.4' : '1';

  // 全て見終わった場合のメッセージ
  if (state.order.length === 0) {
    completeScreen.querySelector('.complete-title').textContent = '対象なし';
    completeScreen.querySelector('.complete-subtitle').innerHTML = 'このモードに該当する語句がありません';
  } else {
    completeScreen.querySelector('.complete-title').textContent = '完了';
    completeScreen.querySelector('.complete-subtitle').innerHTML = 'お疲れさまでした<br>本日の学習を達成しました';
  }

  completeScreen.classList.add('show');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('currentNum').textContent = state.order.length;

  // 完了時はボタン無効化
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('hardBtn').disabled = true;
  document.getElementById('learnedBtn').disabled = true;
}

// ========================================
// イベント
// ========================================
document.getElementById('nextBtn').addEventListener('click', () => nextCard('right'));
document.getElementById('hardBtn').addEventListener('click', () => markCurrent('hard'));
document.getElementById('learnedBtn').addEventListener('click', () => markCurrent('learned'));

// モード切替
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;

    // ボタンを再有効化
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('hardBtn').disabled = false;
    document.getElementById('learnedBtn').disabled = false;

    buildOrder();
    renderCard();
  });
});

// メニュー
const menuOverlay = document.getElementById('menuOverlay');
document.getElementById('menuBtn').addEventListener('click', () => {
  menuOverlay.classList.add('show');
});
document.getElementById('menuCloseBtn').addEventListener('click', () => {
  menuOverlay.classList.remove('show');
});
menuOverlay.addEventListener('click', (e) => {
  if (e.target === menuOverlay) menuOverlay.classList.remove('show');
});

document.getElementById('shuffleItem').addEventListener('click', () => {
  buildOrder();
  shuffleOrder();
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('hardBtn').disabled = false;
  document.getElementById('learnedBtn').disabled = false;
  renderCard();
  menuOverlay.classList.remove('show');
});

document.getElementById('resetProgressItem').addEventListener('click', () => {
  if (confirm('現在の学習位置をリセットしますか?\n(覚えた/苦手の記録は残ります)')) {
    state.currentIdx = 0;
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('hardBtn').disabled = false;
    document.getElementById('learnedBtn').disabled = false;
    buildOrder();
    renderCard();
  }
  menuOverlay.classList.remove('show');
});

document.getElementById('resetAllItem').addEventListener('click', () => {
  if (confirm('全データをリセットしますか?\n覚えた/苦手の記録もすべて消えます。')) {
    state.status = {};
    state.currentIdx = 0;
    saveState();
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('hardBtn').disabled = false;
    document.getElementById('learnedBtn').disabled = false;
    buildOrder();
    renderCard();
  }
  menuOverlay.classList.remove('show');
});

// 完了画面のボタン
document.getElementById('restartBtn').addEventListener('click', () => {
  state.currentIdx = 0;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('hardBtn').disabled = false;
  document.getElementById('learnedBtn').disabled = false;
  buildOrder();
  renderCard();
});

document.getElementById('reviewHardBtn').addEventListener('click', () => {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-mode="hard"]').classList.add('active');
  state.mode = 'hard';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('hardBtn').disabled = false;
  document.getElementById('learnedBtn').disabled = false;
  buildOrder();
  renderCard();
});

// キーボードショートカット (PC利用時)
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!isFlipped) {
      flipCard();
    } else {
      nextCard('right');
    }
  } else if (e.key === '1' || e.key === 'ArrowLeft') {
    if (isFlipped) markCurrent('hard');
  } else if (e.key === '2' || e.key === 'ArrowRight') {
    if (isFlipped) markCurrent('learned');
  }
});

// ========================================
// 初期化
// ========================================
loadState();
buildOrder();
renderCard();
</script>
